<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RaGeX Demo Frame</title>
    <style>
      :root {
        --bg: #081222;
        --surface: #0f1d33;
        --surface-2: #14263f;
        --border: #1e3454;
        --text: #eaf1fa;
        --muted: #9cb0cb;
        --dim: #6e8299;
        --connector: #2e4a72;
        --cyan: #35c4f0;
        --violet: #7c6cff;
        --green: #35d07f;
        --amber: #f3a83b;
        --red: #f05252;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .frame {
        position: relative;
        width: 1920px;
        height: 1080px;
        padding: 72px;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(53, 196, 240, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(53, 196, 240, 0.05) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.45;
      }

      .topline {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--dim);
        font-size: 20px;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .mark {
        width: 48px;
        height: 48px;
        border: 1px solid var(--border);
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: var(--cyan);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-weight: 800;
      }

      .stage {
        position: relative;
        z-index: 1;
        height: calc(100% - 72px);
        display: grid;
        gap: 40px;
        align-items: center;
      }

      .two {
        grid-template-columns: 0.82fr 1.18fr;
      }

      .three {
        grid-template-columns: repeat(3, 1fr);
      }

      .title {
        max-width: 920px;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--cyan);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 100px;
        line-height: 0.96;
        letter-spacing: 0;
      }

      h1 span {
        color: var(--cyan);
      }

      h2 {
        margin: 0 0 20px;
        font-size: 58px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 30px;
        line-height: 1.42;
      }

      .mono {
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .panel,
      .metric,
      .terminal,
      .screenshot {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .panel {
        padding: 36px;
      }

      .metric {
        min-height: 214px;
        padding: 30px;
      }

      .metric small,
      .label {
        display: block;
        color: var(--dim);
        font-size: 18px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .metric strong {
        display: block;
        margin: 18px 0 10px;
        color: var(--cyan);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 54px;
        line-height: 1;
      }

      .metric em {
        color: var(--muted);
        font-size: 22px;
        font-style: normal;
      }

      .pipeline {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 18px;
        margin-top: 42px;
      }

      .node {
        min-height: 154px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
      }

      .node b {
        display: block;
        width: 48px;
        height: 48px;
        margin-bottom: 20px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: rgba(53, 196, 240, 0.12);
        color: var(--cyan);
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .node span {
        display: block;
        color: var(--text);
        font-size: 24px;
        font-weight: 800;
      }

      .node small {
        color: var(--muted);
        font-size: 17px;
      }

      .screenshot {
        padding: 14px;
        overflow: hidden;
        height: 760px;
      }

      .screenshot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top left;
        border-radius: 4px;
        display: block;
      }

      .screenshot.detail img {
        object-position: top right;
      }

      .list {
        display: grid;
        gap: 18px;
        margin-top: 30px;
      }

      .item {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        padding: 20px 22px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface-2);
      }

      .dot {
        width: 14px;
        height: 14px;
        margin-top: 12px;
        border-radius: 999px;
        background: var(--cyan);
        flex: 0 0 auto;
      }

      .item b {
        display: block;
        margin-bottom: 4px;
        font-size: 26px;
      }

      .item span {
        color: var(--muted);
        font-size: 22px;
        line-height: 1.3;
      }

      .terminal {
        padding: 32px;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 24px;
        line-height: 1.55;
        white-space: pre-wrap;
        color: var(--muted);
      }

      .terminal b {
        color: var(--green);
      }

      .terminal .cyan {
        color: var(--cyan);
      }

      .terminal .violet {
        color: var(--violet);
      }

      .risk-high {
        color: var(--red);
      }

      .risk-med {
        color: var(--amber);
      }

      .badge-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .badge {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 12px 18px;
        color: var(--muted);
        background: rgba(20, 38, 63, 0.7);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 18px;
      }

      .accent-cyan {
        color: var(--cyan);
      }

      .accent-violet {
        color: var(--violet);
      }

      .wide {
        grid-column: 1 / -1;
      }

      .footer {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 36px;
        display: flex;
        justify-content: space-between;
        color: var(--dim);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="grid"></div>
      <div class="topline">
        <div class="brand"><div class="mark">RX</div><span>RaGeX Pricing Guardrail</span></div>
        <span id="stamp" class="mono"></span>
      </div>
      <main id="scene" class="stage"></main>
      <div class="footer">
        <span>guardian-ai-ragex.onrender.com/dashboard</span>
        <span id="count"></span>
      </div>
    </div>
    <script>
      const scenes = [
        {
          type: "title",
          eyebrow: "Hackathon demo",
          title: "<span>RaGeX</span> Pricing Guardrail",
          body: "Live pricing checks, INR regret scoring, grounded RAG explanations, and Exasol persistence in one review console.",
          badges: ["FastAPI", "Exasol", "scikit-learn", "RAG", "Dashboard"]
        },
        {
          type: "split-list",
          eyebrow: "Problem",
          title: "Pricing bots move faster than human review.",
          body: "A bad model release, stale competitor signal, or broken feed can push prices below floor, above ceiling, or into drift before teams notice.",
          items: [
            ["Floor breach", "Revenue risk when prices go below allowed minimums."],
            ["Ceiling breach", "Trust and conversion risk when prices jump too high."],
            ["Silent drift", "Small changes compound until margin damage is visible late."]
          ]
        },
        {
          type: "pipeline",
          eyebrow: "Architecture",
          title: "One pipeline from decision to explanation.",
          body: "Simulator decisions flow through Exasol, guardrail checks, regret scoring, RAG retrieval, and analyst review."
        },
        {
          type: "screenshot",
          eyebrow: "Main dashboard",
          title: "Current risk posture first.",
          body: "Total decisions, average regret, confidence, high-risk count, evidence coverage, and trend charts are visible immediately.",
          image: "../screenshots/main-dashboard.png"
        },
        {
          type: "screenshot-detail",
          eyebrow: "Decision explorer",
          title: "Rows become review work.",
          body: "Each SKU shows selected price, best counterfactual price, estimated regret, risk level, and confidence, with severity filters.",
          image: "../screenshots/main-dashboard.png"
        },
        {
          type: "screenshot-detail",
          eyebrow: "Decision detail",
          title: "Why this price was risky.",
          body: "The side panel shows reason, factor influence, counterfactual result, evidence snippets, and uncertainty.",
          image: "../screenshots/dashboard-with-detail.png"
        },
        {
          type: "cards",
          eyebrow: "Grounded RAG",
          title: "Answer only when evidence exists.",
          body: "Policy docs, incident reports, SOPs, escalation rules, constraints, and example decisions are chunked and retrieved before explanation.",
          cards: [
            ["Retrieve", "Find relevant policy and incident snippets.", "accent-violet"],
            ["Explain", "Summarize the decision with citations.", "accent-cyan"],
            ["Refuse", "Decline unrelated questions instead of inventing.", "risk-med"]
          ]
        },
        {
          type: "terminal",
          eyebrow: "Exasol persistence",
          title: "Database-backed demo state.",
          body: "The public deployment persists decisions and vector chunks in Exasol.",
          code: "GET /health\\n{\\n  \"status\": \"healthy\",\\n  \"storage_backend\": \"exasol\",\\n  \"vector_backend\": \"exasol_python_vectors\",\\n  \"llm_provider\": \"groq\",\\n  \"rag_chunks\": 132,\\n  \"decision_records\": 42\\n}"
        },
        {
          type: "terminal",
          eyebrow: "Integration",
          title: "Clean handoff from guardrail simulator.",
          body: "Divija's bot can POST one pricing decision. The RAG dashboard converts, scores, stores, explains, and displays it.",
          code: "POST /integrations/guardrail-decision\\n{\\n  \"sku_id\": \"SKU-0001\",\\n  \"old_price\": 499.0,\\n  \"new_price\": 699.0,\\n  \"flagged\": true,\\n  \"flag_reason\": \"Price exceeds competitor ceiling\",\\n  \"severity\": 0.8\\n}"
        },
        {
          type: "metrics",
          eyebrow: "Impact",
          title: "From alert to explainable action.",
          body: "RaGeX joins three team streams into one workflow: guardrail signals, regret cost, and grounded evidence.",
          metrics: [
            ["42", "persisted decisions"],
            ["132", "retrieval chunks"],
            ["100%", "evidence coverage"],
            ["2 sec", "dashboard polling"]
          ]
        },
        {
          type: "title",
          eyebrow: "Close",
          title: "Safer pricing, <span>while decisions are still fixable.</span>",
          body: "RaGeX turns automated pricing from a black-box stream into a governed, measurable, explainable review loop.",
          badges: ["Live dashboard", "Exasol-backed", "Regret-aware", "Evidence-grounded"]
        }
      ];

      const sceneIndex = Number(new URLSearchParams(location.search).get("scene") || "1") - 1;
      const scene = scenes[Math.max(0, Math.min(scenes.length - 1, sceneIndex))];
      document.getElementById("stamp").textContent = `scene ${String(sceneIndex + 1).padStart(2, "0")}`;
      document.getElementById("count").textContent = `${sceneIndex + 1} / ${scenes.length}`;

      const root = document.getElementById("scene");
      const escapeHtml = (value) =>
        String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

      function titleBlock() {
        return `<div class="title"><p class="eyebrow">${scene.eyebrow}</p><h1>${scene.title}</h1><p>${scene.body}</p>${badges(scene.badges)}</div>`;
      }

      function badges(items = []) {
        return `<div class="badge-row">${items.map((item) => `<span class="badge">${escapeHtml(item)}</span>`).join("")}</div>`;
      }

      function list(items) {
        return `<div class="list">${items.map(([head, text]) => `<div class="item"><i class="dot"></i><div><b>${escapeHtml(head)}</b><span>${escapeHtml(text)}</span></div></div>`).join("")}</div>`;
      }

      function render() {
        if (scene.type === "title") {
          root.innerHTML = titleBlock();
          return;
        }
        if (scene.type === "split-list") {
          root.classList.add("two");
          root.innerHTML = `<div><p class="eyebrow">${scene.eyebrow}</p><h2>${scene.title}</h2><p>${scene.body}</p></div><div>${list(scene.items)}</div>`;
          return;
        }
        if (scene.type === "pipeline") {
          root.innerHTML = `<div><p class="eyebrow">${scene.eyebrow}</p><h2>${scene.title}</h2><p>${scene.body}</p><div class="pipeline">${["Simulator", "Exasol", "Guardrail", "Regret", "RAG", "Dashboard"].map((name, index) => `<div class="node"><b>${["SIM", "DB", "GR", "INR", "AI", "UI"][index]}</b><span>${name}</span><small>${["decision feed", "tables + vectors", "rules + z-score", "counterfactual", "grounded evidence", "review console"][index]}</small></div>`).join("")}</div></div>`;
          return;
        }
        if (scene.type === "screenshot") {
          root.classList.add("two");
          root.innerHTML = `<div><p class="eyebrow">${scene.eyebrow}</p><h2>${scene.title}</h2><p>${scene.body}</p></div><div class="screenshot"><img src="${scene.image}" alt=""></div>`;
          return;
        }
        if (scene.type === "screenshot-detail") {
          root.classList.add("two");
          root.innerHTML = `<div class="screenshot detail"><img src="${scene.image}" alt=""></div><div><p class="eyebrow">${scene.eyebrow}</p><h2>${scene.title}</h2><p>${scene.body}</p></div>`;
          return;
        }
        if (scene.type === "cards") {
          root.innerHTML = `<div><p class="eyebrow">${scene.eyebrow}</p><h2>${scene.title}</h2><p>${scene.body}</p><div class="pipeline three">${scene.cards.map(([head, text, klass]) => `<div class="metric"><small>${escapeHtml(head)}</small><strong class="${klass}">${escapeHtml(head)}</strong><em>${escapeHtml(text)}</em></div>`).join("")}</div></div>`;
          return;
        }
        if (scene.type === "terminal") {
          root.classList.add("two");
          root.innerHTML = `<div><p class="eyebrow">${scene.eyebrow}</p><h2>${scene.title}</h2><p>${scene.body}</p></div><pre class="terminal">${escapeHtml(scene.code)}</pre>`;
          return;
        }
        if (scene.type === "metrics") {
          root.innerHTML = `<div><p class="eyebrow">${scene.eyebrow}</p><h2>${scene.title}</h2><p>${scene.body}</p><div class="pipeline">${scene.metrics.map(([value, label]) => `<div class="metric"><small>${escapeHtml(label)}</small><strong>${escapeHtml(value)}</strong><em>demo signal</em></div>`).join("")}</div></div>`;
        }
      }

      render();
    </script>
  </body>
</html>
